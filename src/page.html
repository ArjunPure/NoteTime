<title>NoteTip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="img/logo-128.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;600&family=Patrick+Hand&family=Indie+Flower&family=Permanent+Marker&family=Nunito:wght@400;600&family=Merriweather:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout: library drawer on the left (docked on wide screens), a desk-colored workspace, paper sheets centered on it, AI panel docked right. */
:root{
  --bg:#E9ECF2; --surface:#FFFFFF; --surface-2:#F4F6FA; --line:#D7DCE6; --fg:#171C2B; --muted:#5A6275;
  --accent:#2747A8; --accent-fg:#FFFFFF; --accent-soft:#E2E8FA;
  --red:#D2352B; --red-soft:#FCE9E7; --green:#1D7F50; --green-soft:#E2F4EA; --amber:#9A6510;
  --shadow:0 1px 2px rgba(23,28,43,.06),0 6px 24px rgba(23,28,43,.08);
  --paper:#FFFFFF; --rule:#C6D3EC; --ink:#1B2747; --p-acc:#2747A8; --p-red:#D2352B; --p-ok:#1D7F50; --margin:#E9A2A2;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-ui:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:Kalam,"Comic Sans MS","Segoe Print",cursive;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131A; --surface:#191D27; --surface-2:#212635; --line:#2D3343; --fg:#E6E9F1; --muted:#9AA2B5;
  --accent:#93AAF6; --accent-fg:#0F1530; --accent-soft:#232E50;
  --red:#FF6E61; --red-soft:#3B1E1C; --green:#55C88F; --green-soft:#16301F; --amber:#E7B460;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --paper:#1A1F2B; --rule:#2E3954; --ink:#E1E7F5; --p-acc:#93AAF6; --p-red:#FF6E61; --p-ok:#55C88F; --margin:#7A3B44;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131A; --surface:#191D27; --surface-2:#212635; --line:#2D3343; --fg:#E6E9F1; --muted:#9AA2B5;
  --accent:#93AAF6; --accent-fg:#0F1530; --accent-soft:#232E50;
  --red:#FF6E61; --red-soft:#3B1E1C; --green:#55C88F; --green-soft:#16301F; --amber:#E7B460;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --paper:#1A1F2B; --rule:#2E3954; --ink:#E1E7F5; --p-acc:#93AAF6; --p-red:#FF6E61; --p-ok:#55C88F; --margin:#7A3B44;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg,.more svg,.twist svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}

/* app shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.sidebar{position:fixed;z-index:30;inset:0 auto 0 0;width:min(300px,86vw);background:var(--surface);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:var(--top);padding-left:env(safe-area-inset-left,0px)}
.app.sb-open .sidebar{transform:none}
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.38);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}
.app.sb-open .scrim{opacity:1;pointer-events:auto}
@media (min-width:1000px){
  .app.sb-open{grid-template-columns:280px minmax(0,1fr)}
  .app.sb-open .sidebar{position:sticky;top:0;height:100vh;width:280px;transform:none}
  .app.sb-open .scrim{display:none}
  .app:not(.sb-open) .sidebar{position:fixed}
}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* sidebar */
.sb-head{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;flex:1}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center}
.brand-mark svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sb-search{margin:0 12px 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface-2)}
.sb-search input{border:0;background:transparent;padding:8px 0;flex:1;min-width:0;outline:none}
.sb-actions{display:flex;gap:8px;padding:0 12px 12px}
.sb-actions .btn{flex:1;justify-content:center;padding:7px 8px;font-size:13px}
.sb-tree{flex:1;overflow:auto;padding:4px 8px 16px}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none;min-height:34px;color:var(--fg);border:1px solid transparent}
.row:hover{background:var(--surface-2)}
.row.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.row.drop{border-color:var(--accent);background:var(--accent-soft)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .count{font-size:12px;color:var(--muted)}
.row .twist{width:18px;height:18px;border:0;background:none;padding:0;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.row .twist svg{width:14px;height:14px}
.row .twist.open{transform:rotate(90deg)}
.row .spacer{width:18px;flex:none}
.dot{width:10px;height:13px;border-radius:2px 3px 3px 2px;flex:none}
.sb-label{padding:12px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sb-foot{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync-dot.local{background:var(--amber)}

/* topbar */
.topbar{position:sticky;top:var(--top);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:58px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;color:var(--muted);font-size:13px}
.crumbs a{color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:6px;white-space:nowrap}
.crumbs a:hover{background:var(--surface-2);color:var(--fg)}
.crumbs .sep{opacity:.6}
.title-input{font-family:var(--f-display);font-weight:700;font-size:18px;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;min-width:0;width:100%;max-width:340px}
.title-input:hover{border-color:var(--line)}
.title-input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tab .ic svg{width:16px;height:16px}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grow{flex:1;min-width:0}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:720px){
  .tb-title{order:5;flex-basis:100%}
  .title-input{max-width:none}
  .tabs{order:6;flex:1}
  .tab{flex:1;justify-content:center;padding:6px 6px}
  .savestate{display:none}
}

/* home */
.home{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home-head h1{font-size:clamp(26px,4vw,36px);font-weight:700}
.home-actions{display:flex;gap:8px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:center;gap:10px}
.section-head h2{font-size:15px;font-family:var(--f-ui);font-weight:600}
.grid-folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.grid-books{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px}
.folder-card{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 14px 14px;cursor:pointer;text-align:left;transition:transform .12s, box-shadow .12s}
.folder-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.folder-card.drop{outline:2px solid var(--accent)}
.folder-ic{width:44px;height:36px;flex:none;position:relative}
.folder-ic svg{width:44px;height:36px}
.folder-card .meta{min-width:0;flex:1}
.folder-card .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-card .sub{font-size:12px;color:var(--muted)}
.book{display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;min-width:0}
.cover{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:6px 12px 12px 6px;background:var(--c);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.book:hover .cover{transform:translateY(-3px) rotate(-.6deg)}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:16%;background:rgba(0,0,0,.18)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 40%)}
.rings{position:absolute;left:4%;top:8%;bottom:8%;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.rings i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.label{position:absolute;left:24%;right:10%;top:16%;background:#FBFBF8;border-radius:4px;padding:8px 10px;color:#1C2233;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.label b{display:block;font-family:var(--f-hand);font-size:16px;line-height:1.2;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.label span{display:block;height:1px;background:#C9D3E8;margin-top:6px}
.paper-peek{position:absolute;right:8%;bottom:8%;width:34%;aspect-ratio:1;border-radius:4px;z-index:1;background-color:#fff;opacity:.92}
.book .bt{display:flex;align-items:flex-start;gap:6px}
.book .bt .tt{flex:1;min-width:0}
.book .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book .sub{font-size:12px;color:var(--muted)}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.more{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.more:hover{background:var(--surface-2);color:var(--fg)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.newbook{border:1.5px dashed var(--line);border-radius:6px 12px 12px 6px;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);background:transparent;width:100%}
.newbook:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}

/* menus, modal, sheet, toast */
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(10,14,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal h3{font-size:20px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;width:100%}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.opt .pv{width:100%;height:46px;border-radius:6px;border:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--surface-2)}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toggle{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:4px 0}
.toggle .t{min-width:0}
.toggle .t b{display:block;font-weight:600;font-size:14px}
.toggle .t span{font-size:12px;color:var(--muted)}
.switch{position:relative;width:40px;height:24px;border-radius:999px;border:0;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:var(--top);transform:translateX(102%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 12px 12px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3{flex:1;font-size:18px}
.sheet-body{overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 32px 18px;display:flex;flex-direction:column;gap:22px}
.sheet-scrim{position:fixed;inset:0;z-index:45;background:rgba(10,14,25,.3)}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* notebook */
.nb-body{display:flex;flex:1;min-height:0;align-items:stretch}
.nb-main{flex:1;min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.paper-col{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.paper{position:relative;background:var(--paper);color:var(--ink);border-radius:4px 4px 6px 6px;box-shadow:0 1px 1px rgba(0,0,0,.05),0 10px 30px rgba(23,28,43,.12);--lh:34px;--padl:36px}
.pc-white{--paper:#FFFFFF;--rule:#C6D3EC;--ink:#1B2747;--p-acc:#2747A8;--p-red:#D2352B;--p-ok:#1D7F50;--margin:#E9A2A2}
.pc-ivory{--paper:#FBF7EC;--rule:#DCD2B8;--ink:#2B2A26;--p-acc:#2747A8;--p-red:#C8352B;--p-ok:#2D7A47;--margin:#E3A39A}
.pc-sky{--paper:#F1F5FD;--rule:#BCCDEE;--ink:#1B2747;--p-acc:#2747A8;--p-red:#D2352B;--p-ok:#1D7F50;--margin:#E9A2A2}
.pc-mint{--paper:#EFF8F2;--rule:#B9DCC7;--ink:#173225;--p-acc:#2747A8;--p-red:#D2352B;--p-ok:#1D7F50;--margin:#E3A39A}
.pc-night{--paper:#1A1F2B;--rule:#2E3954;--ink:#E1E7F5;--p-acc:#93AAF6;--p-red:#FF6E61;--p-ok:#55C88F;--margin:#7A3B44}
.sp-narrow{--lh:calc(28px * var(--z,1))}.sp-medium{--lh:calc(34px * var(--z,1))}.sp-wide{--lh:calc(42px * var(--z,1))}
.ed{position:relative;padding:0;border-radius:inherit;background-position:0 calc(var(--lh) - 4px)}
.pt-lined .ed,.pt-college .ed{background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px) var(--lh))}
.pt-college{--padl:76px}
.pt-college .ed::before{content:"";position:absolute;top:0;bottom:0;left:calc(60px * var(--z,1));width:1.5px;background:var(--margin);pointer-events:none}
.pt-graph .ed{background-image:linear-gradient(to bottom,var(--rule) 1px,transparent 1px),linear-gradient(to right,var(--rule) 1px,transparent 1px);background-size:var(--lh) var(--lh);background-position:0 calc(var(--lh) - 4px)}
.pt-dotted .ed{background-image:radial-gradient(circle at 1px 1px,var(--rule) 1.4px,transparent 1.6px);background-size:var(--lh) var(--lh);background-position:-1px calc(var(--lh) - 5px)}
.ed-ta,.ed-mirror{box-sizing:border-box;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);padding:var(--lh) calc(32px * var(--z,1)) calc(var(--lh) * 2) calc(var(--padl) * var(--z,1));white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;letter-spacing:0;margin:0;border:0;width:100%}
.f-hand{--ff:var(--f-hand);--fs:calc(var(--lh) * .6)}
.f-clean{--ff:var(--f-ui);--fs:calc(var(--lh) * .5)}
.f-mono{--ff:var(--f-mono);--fs:calc(var(--lh) * .44)}
.ed-ta{position:relative;display:block;background:transparent;color:var(--ink);resize:none;outline:none;overflow:hidden;min-height:calc(var(--lh) * 26);caret-color:var(--p-acc)}
.ed-ta::placeholder{color:color-mix(in srgb,var(--ink) 40%,transparent)}
.ed-mirror{position:absolute;inset:0;color:transparent;pointer-events:none;user-select:none}
.ed-mirror .ml{min-height:var(--lh)}
.mk-bad{text-decoration:underline wavy var(--p-red);text-decoration-thickness:1.5px;text-underline-offset:5px}
.mk-form{text-decoration:underline dotted var(--p-red);text-decoration-thickness:2.5px;text-underline-offset:6px}
.an{font-family:var(--f-ui);font-size:12px;font-weight:600;vertical-align:2px;margin-left:10px;white-space:nowrap}
.an-ok{color:var(--p-ok)}
.an-bad{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--p-red);color:#fff;font-size:12px;vertical-align:1px}
.an-ghost{font-family:var(--ff);font-size:var(--fs);font-weight:400;color:var(--p-acc);opacity:.6;margin-left:0;vertical-align:0}
.an-solve{color:var(--p-acc);opacity:.75;font-weight:500}
.kbd{font-family:var(--f-ui);font-size:10.5px;font-weight:600;border:1px solid color-mix(in srgb,var(--p-acc) 50%,transparent);color:var(--p-acc);border-radius:5px;padding:1px 5px;margin-left:8px;vertical-align:3px;opacity:.85}
.badge-dock{position:sticky;height:0;z-index:8}
.math-badge{position:absolute;left:-15px;top:-15px;height:34px;min-width:34px;border-radius:17px;border:2px solid var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 9px;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.math-badge.bad{background:var(--red);color:#fff}
.math-badge.good{background:var(--green-soft);color:var(--green);font-size:12px;font-weight:600}
.math-badge.bad .bang{font-size:18px;line-height:1}
.math-badge.bad .n{font-size:12px;font-weight:600;opacity:.95}
.math-badge.pulse{animation:pulse .6s ease 1}
@keyframes pulse{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.math-pop{position:absolute;left:-15px;top:26px;width:min(380px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-ui)}
.math-pop h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.issue{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.issue .k{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--red)}
.issue .k .ln{color:var(--muted);font-weight:500;margin-left:auto;font-size:12px}
.issue code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:6px;align-self:flex-start;max-width:100%;overflow-wrap:anywhere}
.issue p{margin:0;font-size:13px;color:var(--muted)}
.issue .ia{display:flex;gap:6px;margin-top:4px}
.issue .ia .btn{padding:4px 9px;font-size:12px}
.pager{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.pager .pg{font-variant-numeric:tabular-nums;font-weight:500;min-width:96px;text-align:center}
.page-strip{display:flex;gap:6px;overflow-x:auto;padding:2px}
.page-pill{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.page-pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* overview & quiz */
.wide-col{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:20px}
.card h3{font-size:16px;font-family:var(--f-ui);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--red)}
.outline{display:flex;flex-direction:column}
.outline button{display:flex;gap:14px;align-items:baseline;text-align:left;border:0;background:transparent;border-top:1px solid var(--line);padding:12px 4px;width:100%}
.outline button:hover{background:var(--surface-2)}
.outline .pn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;width:52px;flex:none}
.outline .ot{min-width:0;flex:1}
.outline .ot b{display:block;font-weight:600}
.outline .ot span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-out p{margin:0 0 10px;line-height:1.6;max-width:68ch}
.kp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.term{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.term b{display:block}
.term span{font-size:13px;color:var(--muted)}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:600}
.ai-tag svg{width:14px;height:14px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.warn{color:var(--amber)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.q-wrap{display:flex;flex-direction:column;gap:16px}
.q-prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.q-text{font-family:var(--f-display);font-size:clamp(19px,2.6vw,24px);font-weight:500;line-height:1.3}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice .lt{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.right .lt{background:var(--green);color:#fff}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice.wrong .lt{background:var(--red);color:#fff}
.choice[disabled]{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
.feedback.right{background:var(--green-soft)}
.feedback.wrong{background:var(--red-soft)}
.feedback b{display:block;margin-bottom:2px}
.score{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:8px}
.review .ri{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
.review .ri .mk{width:20px;height:20px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.history{display:flex;gap:6px;align-items:flex-end;height:48px}
.history i{width:14px;border-radius:3px 3px 0 0;background:var(--accent);opacity:.75}

/* AI panel */
.ai-panel{width:390px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:calc(var(--top) + var(--tbh,58px));height:calc(100vh - var(--tbh,58px) - var(--top));z-index:16}
.ai-panel[hidden]{display:none!important}
.inkbar.dock-top,.inkbar.dock-bottom{flex-wrap:wrap;overflow:visible;row-gap:4px}
.inkbar.dock-bottom{width:max-content}
@media (max-width:640px){.inkbar.dock-top,.inkbar.dock-bottom{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.inkbar.dock-top::-webkit-scrollbar,.inkbar.dock-bottom::-webkit-scrollbar{display:none}}
.tb-title{min-width:150px}
@media (max-width:1100px){.ai-panel{position:fixed;z-index:50;top:0;right:0;bottom:0;height:auto;width:min(420px,100%);padding-top:var(--top);box-shadow:var(--shadow)}}
.ai-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 16px;border-bottom:1px solid var(--line)}
.ai-head h3{flex:1;font-size:16px;display:flex;align-items:center;gap:8px}
.ai-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;border-radius:14px;padding:10px 12px;line-height:1.55;font-size:14px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.assistant p{margin:0 0 8px}.msg.assistant p:last-child{margin:0}
.msg.assistant ul{margin:0 0 8px;padding-left:18px}
.msg .mact{display:flex;gap:6px;margin-top:8px}
.msg .mact button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 8px;font-size:12px}
.msg.err{background:var(--red-soft);color:var(--fg)}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.ai-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px}
.ai-chips button:hover{border-color:var(--accent);color:var(--accent)}
.ai-input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ai-input textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;max-height:140px;outline:none}
.ai-input textarea:focus{border-color:var(--accent)}
.ai-intro{color:var(--muted);font-size:13px;line-height:1.55;padding:4px 2px}
.loading{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);min-height:60vh}

/* ---- NoteTip additions ---- */
.iconbtn.sm{width:30px;height:30px}
.iconbtn[disabled]{opacity:.4;cursor:default}
.sb-import{margin:0 12px 12px;justify-content:center;font-size:13px;padding:7px 8px;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sb-import:hover{background:var(--accent-soft);filter:brightness(.97)}
.import-card{display:flex;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;flex-wrap:wrap;width:100%}
.import-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.import-card .ic-wrap{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.import-card .ic-wrap svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.import-card .ttl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.import-card .ttl b{font-family:var(--f-display);font-size:17px}
.import-card .ttl span{color:var(--muted);font-size:13px;max-width:62ch}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend i,.srcnote i,.tg-head i{font-style:normal;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;color:var(--fg)}
.hl-main{background:rgba(66,133,244,.24)}.hl-def{background:rgba(52,168,83,.26)}.hl-ex{background:rgba(251,188,4,.34)}
.hl-formula{background:rgba(142,68,173,.24)}.hl-imp{background:rgba(234,67,53,.26)}.hl-q{background:rgba(0,150,160,.24)}
.ed-mirror .hl{border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:3px 0}
.ed-mirror .ml.h-head{background:color-mix(in srgb,var(--p-acc) 11%,transparent);border-radius:5px;margin:0 -8px;padding:0 8px}
.srcnote{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srcnote .ic svg{width:15px;height:15px}

/* ink toolbar */
.inkbar{position:sticky;top:calc(var(--top) + var(--tbh,58px) + 8px);z-index:15;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 6px;box-shadow:0 4px 18px rgba(23,28,43,.08);overflow-x:auto;scrollbar-width:thin;min-height:48px}
.tb-group{display:flex;align-items:center;gap:2px;flex:none}
.tb-opts{gap:6px}
.tb-sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 2px}
.tb-grow{flex:1;min-width:4px}
.tool{width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--surface-2)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool[disabled]{opacity:.35;cursor:default}
.tool.busy::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.sw-row,.sz-row,.sym-row{display:flex;align-items:center;gap:4px;flex:none}
.csw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none;padding:0;position:relative}
.csw.sm{width:20px;height:20px}
.csw.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.csw.custom{background:conic-gradient(#f44,#fd4,#4d4,#4df,#44f,#d4f,#f44);cursor:pointer}
.csw.custom.on{background:var(--c)}
.csw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sz{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.sz i{border-radius:50%;background:var(--fg);display:block}
.sz.on{background:var(--accent-soft)}.sz.on i{background:var(--accent)}
.sym{min-width:32px;height:30px;padding:0 7px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.sym:hover{border-color:var(--accent);color:var(--accent)}
.tagbtn{height:28px;padding:0 9px;border-radius:7px;border:0;font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap}
.tagbtn:hover{filter:brightness(.95);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tb-hint{font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 4px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover{background:var(--surface-2)}
.tbtn.danger{color:var(--red)}

/* ink layers */
.ed-ta{z-index:1}
.ink-base,.ink-live{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.ink-live{z-index:3}
.ink-base.mult,.ink-live.mult{mix-blend-mode:multiply}
.paper.drawing .ink-live{pointer-events:auto;touch-action:none;cursor:crosshair}
.paper.drawing .ed-ta{user-select:none;-webkit-user-select:none}
.pins{position:absolute;inset:0;pointer-events:none;z-index:4}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 8px 0 6px;border-radius:14px;border:2px solid var(--paper);background:var(--p-acc);color:#fff;font:600 12px var(--f-ui);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.pin svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin.empty{opacity:.6}
.selbar{position:absolute;z-index:6;display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);font-family:var(--f-ui)}
.sel-colors{display:flex;gap:3px}
.vpop{position:absolute;z-index:7;width:min(320px,calc(100% - 12px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-ui);font-size:14px}
.vp-head{display:flex;align-items:center;gap:8px}
.vp-head b{flex:none}.vp-head .note{flex:1}
.pin-n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.vp-text{resize:vertical;min-height:84px;font-size:14px;line-height:1.5}
.vp-partial{font-size:13px;color:var(--muted);font-style:italic;min-height:0}
.vp-partial:empty{display:none}
.vp-acts{display:flex;gap:6px;align-items:center}
.vp-acts .btn{padding:6px 10px;font-size:13px}
.vp-acts svg,.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vp-acts .btn.rec{background:var(--red);color:#fff;border-color:var(--red)}
.recdot{width:10px;height:10px;border-radius:50%;background:#fff;display:inline-block;animation:pulse2 1s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.35}}
.badge-dock{top:calc(var(--top) + var(--tbh,58px) + 70px)}

/* overview extras */
.tag-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tag-group{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.tag-group ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.tg-head{display:flex;align-items:center;justify-content:space-between}
.voice-list{display:flex;flex-direction:column}
.vitem{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0}
.vitem .vt{flex:1;min-width:0;line-height:1.5}
.vitem .btn{padding:5px 10px;font-size:12px}

/* import / export */
.modal.wide{width:min(720px,100%)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--fg)}
.drop .ic svg{width:26px;height:26px;color:var(--accent)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.has{border-style:solid;border-color:var(--accent)}
.steps{border-radius:10px;background:var(--surface-2);padding:10px 12px}
.opts.fmt{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.opts.fmt .opt{align-items:flex-start;text-align:left;padding:10px}
.opts.fmt .opt b{font-size:13px}
